<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Brand Spectrum Section</title>
<!--
  Brand spectrum — "For work. For movement. For culture. For life."
  Backup of the V3 homepage section H03, removed from the landing page on 2026-09-29.

  Self-contained: open this file directly, or copy the <section class="bs"> block, the
  "Brand spectrum" <style> and the <script> into another page. It needs only the images/
  and fonts/ folders next to it (no build step, no libraries).

  How it works: the section is a tall scroll track with a sticky full-screen stage. Scroll
  progress picks one of four beats; each beat cross-fades its own HD still (AVIF with a JPEG
  fallback, and a 9:16 crop on phones) and its line of copy, while the stage eases from a
  slight push-in to rest. Native scrolling only; with reduced motion the beats simply stack.

  To change the beats, edit the four <picture> frames and the four .bs_word lines (same order),
  and the labels in data-label. Images were cut from the 4K renders in ../../../Website Material
  by scripts/build-images.mjs (before removal): Gulfalts Office / Office space 9-16, Padel /
  padel 9-16, Galleria Loft Space, Outdoor food court.
-->
<style>
/* Page chrome for this standalone preview only. */
html, body { margin: 0; background: #101010; }
.bs-demo-note {
  min-height: 60vh; display: grid; place-items: center; padding: 24px;
  font: 400 16px/1.5 "Seasonsans Trial", Arial, sans-serif; color: rgba(255, 255, 255, 0.7); text-align: center;
}

/* ---------------------------------------------------------------------------
   Brand spectrum
--------------------------------------------------------------------------- */
@font-face { font-family: 'Seasonserif Trial'; src: url('fonts/SeasonSerif-TRIAL-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Seasonsans Trial'; src: url('fonts/SeasonSans-TRIAL-Light.woff2') format('woff2'); font-weight: 300; font-display: swap; }
@font-face { font-family: 'Seasonsans Trial'; src: url('fonts/SeasonSans-TRIAL-Medium.woff2') format('woff2'); font-weight: 500; font-display: swap; }

.bs {
  --bs-ink: #101010;
  --bs-white: #ffffff;
  --bs-white-2: rgba(255, 255, 255, 0.7);
  --bs-line: rgba(255, 255, 255, 0.22);
  --bs-gutter: clamp(16px, 4.7vw, 96px);
  --bs-top: 108px;          /* clear of a fixed header; set to 32px if the page has none */
  --bs-track: 360vh;        /* scroll length: ~65vh per beat */
  --bs-ease: cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  background: var(--bs-ink);
  color: var(--bs-white);
  font-family: 'Seasonsans Trial', Arial, sans-serif;
  font-weight: 300;
}
.bs *, .bs *::before, .bs *::after { box-sizing: border-box; }
.bs p, .bs h2 { margin: 0; }

.bs_track { position: relative; height: var(--bs-track); }
.bs_sticky { position: sticky; top: 0; height: 100vh; height: 100lvh; overflow: hidden; isolation: isolate; }

/* Stage: stacked stills, a slow push-in to rest across the section. */
.bs_stage {
  position: absolute; inset: 0;
  transform: scale(calc(1.06 - var(--bs-p, 0) * 0.06));
  will-change: transform;
}
.bs_frame, .bs_frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.bs_frame { opacity: 0; transition: opacity 700ms ease; }
.bs_frame.is-current { opacity: 1; }
.bs_scrim { position: absolute; inset: 0; background: rgba(16, 16, 16, 0.3); pointer-events: none; }

/* Copy: one line per beat, centred. */
.bs_overlay { position: absolute; inset: 0 0 auto; height: 100svh; pointer-events: none; }
.bs_words { position: absolute; inset: 0; display: grid; place-items: center; padding: 0 var(--bs-gutter); }
.bs_word {
  grid-area: 1 / 1;
  font-family: 'Seasonserif Trial', Georgia, serif; font-weight: 400;
  font-size: clamp(2.5rem, 1.784rem + 2.393vw, 3.9375rem); line-height: 1.2; letter-spacing: -0.01em;
  text-align: center;
  opacity: 0; transform: translate3d(0, 16px, 0);
  transition: opacity 480ms ease, transform 700ms var(--bs-ease);
}
.bs_word.is-current { opacity: 1; transform: none; }

/* HUD: section + beat label, counter, progress rule. */
.bs_hud {
  position: absolute; top: var(--bs-top); left: var(--bs-gutter); right: var(--bs-gutter);
  display: flex; justify-content: space-between; align-items: baseline; gap: 24px;
  font-size: 0.75rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
  font-variant-numeric: tabular-nums;
}
.bs_hud-label { display: flex; gap: 16px; align-items: baseline; }
.bs_hud-section { color: var(--bs-white-2); }
.bs_progress { position: absolute; left: var(--bs-gutter); right: var(--bs-gutter); bottom: 32px; height: 1px; background: var(--bs-line); }
.bs_progress span { display: block; height: 100%; background: var(--bs-white); transform-origin: left; transform: scaleX(var(--bs-p, 0)); }

@media (max-width: 767px) {
  .bs { --bs-top: 88px; --bs-track: 260vh; }
  .bs_hud-section { display: none; }
  .bs_progress { bottom: 20px; }
}

/* Without the script, or with reduced motion: no pinning, the four beats stack. */
.bs:not(.is-ready) .bs_track, .bs:not(.is-ready) .bs_sticky { height: auto; position: relative; }
.bs:not(.is-ready) .bs_stage { position: relative; transform: none; display: grid; }
.bs:not(.is-ready) .bs_frame { position: relative; opacity: 1; aspect-ratio: 16 / 9; height: auto; }
.bs:not(.is-ready) .bs_scrim, .bs:not(.is-ready) .bs_hud, .bs:not(.is-ready) .bs_progress { display: none; }
.bs:not(.is-ready) .bs_overlay { position: relative; height: auto; }
.bs:not(.is-ready) .bs_words { position: relative; gap: 8px; padding: 48px var(--bs-gutter); place-items: start; }
.bs:not(.is-ready) .bs_word { grid-area: auto; opacity: 1; transform: none; text-align: left; }
@media (prefers-reduced-motion: reduce) {
  .bs_frame, .bs_word { transition: none; }
}
</style>
</head>
<body>

<div class="bs-demo-note">Scroll to preview the brand spectrum section.</div>

<section class="bs" aria-labelledby="bs-title">
  <h2 id="bs-title" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Destinations for work, movement, culture and life.</h2>
  <div class="bs_track">
    <div class="bs_sticky">
      <div class="bs_stage">
        <picture class="bs_frame is-current" data-beat="0">
          <source media="(max-width: 767px)" type="image/avif" srcset="images/h03-work-mobile-720.avif 720w, images/h03-work-mobile-1080.avif 1080w" sizes="100vw" />
          <source media="(max-width: 767px)" type="image/jpeg" srcset="images/h03-work-mobile-720.jpg 720w, images/h03-work-mobile-1080.jpg 1080w" sizes="100vw" />
          <source type="image/avif" srcset="images/h03-work-desktop-1280.avif 1280w, images/h03-work-desktop-1920.avif 1920w, images/h03-work-desktop-2560.avif 2560w" sizes="100vw" />
          <img src="images/h03-work-desktop-1920.jpg" srcset="images/h03-work-desktop-1280.jpg 1280w, images/h03-work-desktop-1920.jpg 1920w, images/h03-work-desktop-2560.jpg 2560w" sizes="100vw" alt="A daylit Gulfalts office with a lounge, desks and tall windows onto a landscaped park." width="2560" height="1440" decoding="async" />
        </picture>
        <picture class="bs_frame" data-beat="1">
          <source media="(max-width: 767px)" type="image/avif" srcset="images/h03-movement-mobile-720.avif 720w, images/h03-movement-mobile-1080.avif 1080w" sizes="100vw" />
          <source media="(max-width: 767px)" type="image/jpeg" srcset="images/h03-movement-mobile-720.jpg 720w, images/h03-movement-mobile-1080.jpg 1080w" sizes="100vw" />
          <source type="image/avif" srcset="images/h03-movement-desktop-1280.avif 1280w, images/h03-movement-desktop-1920.avif 1920w, images/h03-movement-desktop-2560.avif 2560w" sizes="100vw" />
          <img src="images/h03-movement-desktop-1920.jpg" srcset="images/h03-movement-desktop-1280.jpg 1280w, images/h03-movement-desktop-1920.jpg 1920w, images/h03-movement-desktop-2560.jpg 2560w" sizes="100vw" alt="An indoor padel hall with a row of glass-walled courts under a steel roof." width="2560" height="1440" loading="lazy" decoding="async" />
        </picture>
        <picture class="bs_frame" data-beat="2">
          <source media="(max-width: 767px)" type="image/avif" srcset="images/h03-culture-mobile-720.avif 720w, images/h03-culture-mobile-1080.avif 1080w" sizes="100vw" />
          <source media="(max-width: 767px)" type="image/jpeg" srcset="images/h03-culture-mobile-720.jpg 720w, images/h03-culture-mobile-1080.jpg 1080w" sizes="100vw" />
          <source type="image/avif" srcset="images/h03-culture-desktop-1280.avif 1280w, images/h03-culture-desktop-1920.avif 1920w, images/h03-culture-desktop-2560.avif 2560w" sizes="100vw" />
          <img src="images/h03-culture-desktop-1920.jpg" srcset="images/h03-culture-desktop-1280.jpg 1280w, images/h03-culture-desktop-1920.jpg 1920w, images/h03-culture-desktop-2560.jpg 2560w" sizes="100vw" alt="A double-height galleria with a café, an olive tree and a mezzanine lined with greenery." width="2560" height="1440" loading="lazy" decoding="async" />
        </picture>
        <picture class="bs_frame" data-beat="3">
          <source media="(max-width: 767px)" type="image/avif" srcset="images/h03-life-mobile-720.avif 720w, images/h03-life-mobile-1080.avif 1080w" sizes="100vw" />
          <source media="(max-width: 767px)" type="image/jpeg" srcset="images/h03-life-mobile-720.jpg 720w, images/h03-life-mobile-1080.jpg 1080w" sizes="100vw" />
          <source type="image/avif" srcset="images/h03-life-desktop-1280.avif 1280w, images/h03-life-desktop-1920.avif 1920w, images/h03-life-desktop-2560.avif 2560w" sizes="100vw" />
          <img src="images/h03-life-desktop-1920.jpg" srcset="images/h03-life-desktop-1280.jpg 1280w, images/h03-life-desktop-1920.jpg 1920w, images/h03-life-desktop-2560.jpg 2560w" sizes="100vw" alt="An evening food court between the buildings, with food trucks, string lights and shared tables." width="2560" height="1440" loading="lazy" decoding="async" />
        </picture>
        <div class="bs_scrim"></div>
      </div>
      <div class="bs_overlay">
        <div class="bs_words" aria-hidden="true">
          <p class="bs_word is-current" data-beat="0">For work.</p>
          <p class="bs_word" data-beat="1">For movement.</p>
          <p class="bs_word" data-beat="2">For culture.</p>
          <p class="bs_word" data-beat="3">For life.</p>
        </div>
        <div class="bs_hud" aria-hidden="true">
          <p class="bs_hud-label"><span class="bs_hud-section">Gulfalts destinations</span><span class="bs_hud-beat" data-labels="Workspace|Movement|Culture|Life">Workspace</span></p>
          <p class="bs_hud-count"><span class="bs_count">01</span> / 04</p>
        </div>
        <div class="bs_progress" aria-hidden="true"><span></span></div>
      </div>
    </div>
  </div>
</section>

<div class="bs-demo-note">End of section.</div>

<script>
/* Brand spectrum: scroll progress → current beat. No libraries, native scrolling only. */
(function () {
  var root = document.querySelector('.bs');
  if (!root) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var track = root.querySelector('.bs_track');
  var frames = root.querySelectorAll('.bs_frame');
  var words = root.querySelectorAll('.bs_word');
  var beatLabel = root.querySelector('.bs_hud-beat');
  var labels = beatLabel.getAttribute('data-labels').split('|');
  var count = root.querySelector('.bs_count');
  var total = words.length;
  var current = -1;
  var ticking = false;

  function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

  function render() {
    ticking = false;
    var rect = track.getBoundingClientRect();
    var distance = track.offsetHeight - window.innerHeight;
    var p = distance > 0 ? clamp(-rect.top / distance) : 0;
    root.style.setProperty('--bs-p', p.toFixed(4));
    var beat = Math.min(total - 1, Math.floor(p * total));
    if (beat === current) return;
    current = beat;
    for (var i = 0; i < total; i++) {
      frames[i].classList.toggle('is-current', i === beat);
      words[i].classList.toggle('is-current', i === beat);
    }
    beatLabel.textContent = labels[beat];
    count.textContent = (beat < 9 ? '0' : '') + (beat + 1);
  }
  function onScroll() {
    if (!ticking) { ticking = true; requestAnimationFrame(render); }
  }

  root.classList.add('is-ready');
  render();
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
})();
</script>
</body>
</html>
